<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디어엉클 주간 마케팅 대시보드</title><style>body{margin:0;background:#f5f6f8;color:#17202a;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 20px 60px}h1{font-size:30px}.muted{color:#6b7280}.tag{background:#dbeafe;color:#1d4ed8;border-radius:20px;padding:7px 12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card,section{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.label{color:#6b7280;font-size:13px}.num{font-size:25px;font-weight:700;margin-top:8px}h2{font-size:20px;margin:28px 0 10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:14px}th{color:#6b7280;font-size:12px}.ok{color:#15803d;font-weight:700}.warn{color:#b45309;font-weight:700}.scroll{overflow:auto}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.cards{grid-template-columns:1fr}}</style><main class="wrap"><span class="tag">DEAR UNCLE · LIVE DATA</span><h1>주간 마케팅 대시보드</h1><p id="period" class="muted">데이터를 불러오는 중…</p><div id="cards" class="cards"></div><h2>핵심 지표</h2><section class="scroll"><table><thead><tr><th>상품</th><th>수량</th><th>상품매출</th><th>주문 수</th></tr></thead><tbody id="products"></tbody></table></section><h2>일별 주문</h2><section class="scroll"><table><thead><tr><th>날짜</th><th>주문 수</th></tr></thead><tbody id="daily"></tbody></table></section><h2>현재 판단</h2><section><p><b>지인 주문:</b> <span id="friend"></span>건 · <b>비지인 주문:</b> <span id="nonfriend"></span>건</p><p class="warn">현재 주문은 대표님 확인상 전부 지인 주문입니다. 다음 목표는 첫 비지인 주문 1건입니다.</p><p class="muted">개인정보는 집계 과정에서 제거되며 이 화면에는 저장되지 않습니다. 데이터는 Cafe24 연동 워크플로가 매일 갱신합니다.</p></section></main><script>const won=n=>'₩'+Number(n||0).toLocaleString('ko-KR');fetch('data/metrics.json?'+Date.now()).then(r=>r.json()).then(d=>{let s=d.summary;document.querySelector('#period').textContent=`${d.period.from||''}–${d.period.to||''} · 마지막 자동 집계 ${d.updated_at}`;document.querySelector('#cards').innerHTML=[['주문 수',s.orders+'건','주문번호 기준'],['결제금액',won(s.paid),'결제 합계'],['객단가',won(s.aov),'결제금액 ÷ 주문 수'],['비지인 주문',s.nonfriend_orders+'건','목표: 첫 1건']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="num">${x[1]}</div><div class="muted">${x[2]}</div></div>`).join('');document.querySelector('#friend').textContent=s.friend_orders;document.querySelector('#nonfriend').textContent=s.nonfriend_orders;document.querySelector('#products').innerHTML=d.products.map(p=>`<tr><td>${p.name}</td><td>${p.qty}</td><td>${won(p.sales)}</td><td>${p.orders}</td></tr>`).join('');document.querySelector('#daily').innerHTML=d.daily.map(x=>`<tr><td>${x.date}</td><td>${x.orders}건</td></tr>`).join('')}).catch(e=>document.querySelector('#period').textContent='데이터 로드 실패: '+e.message)</script></html>
