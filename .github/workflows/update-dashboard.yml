name: update-dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *' # 매일 12:15 KST
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Fetch Cafe24 orders
        env:
          CAFE24_ACCESS_TOKEN: ${{ secrets.CAFE24_ACCESS_TOKEN }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
        run: python scripts/fetch_cafe24.py
      - name: Build privacy-safe metrics
        run: python scripts/build_metrics.py private/orders.csv data/metrics.json
      - name: Publish aggregate only
        run: |
          rm -rf private
          git config user.name 'dearuncle-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/metrics.json
          git diff --cached --quiet || git commit -m 'chore: update dashboard metrics'
          git push
